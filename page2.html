    <div id="skub" class="container">

            <h2>SKU Generator</h2>  

        <div style="padding: 20px;">
            <label for="cat">Category</label>
                <select id="cat" class="form-control" required>
                    <option value="0">Select Category</option>
                    <option value="Perishables">Perishables</option>
                    <option value="Consumables">Consumables</option>
                    <option value="Non-Perishables">Non-Perishables</option>
                </select>
                <br>
            <label>Product Name</label>
                <input type="text" id="prod" placeholder="e.g Bottled Water" class="form-control" required>
                <br>
            <label>Stock Quantity</label>
                <input type="number" id="quan" placeholder="e.g 30, 40, 50" class="form-control" required> 
            <br><br>
             
    <div class="d-grid gap-2">
    <button type="button" py-click="show_sku" class="btn btn-outline-success" style="font-family: Limelight, serif; box-shadow: 0 0 10px 1px rgba(27, 27, 27, 0.5);">Generate SKU</button>
